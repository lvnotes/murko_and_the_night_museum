<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мурко і Ніч у музеї</title>
<style>
/* шрифт лежить поруч у папці fonts — працює і без інтернету */
@font-face{font-family:Nunito;font-weight:600 700;font-display:swap;src:url(fonts/nunito-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:600 700;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:Nunito;font-weight:800 900;font-display:swap;src:url(fonts/nunito-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:800 900;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0b18;font-family:"Nunito","Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#1c1838}
#bg,#props,#cast,#hud,#card,#dlg,#fx{position:absolute}
#bg{inset:0}
#bg svg,#bg img{position:absolute;left:0;top:0;width:1600px;height:900px;display:block}
#props{inset:0;pointer-events:none}
#props>*{pointer-events:auto}
#cast{inset:0;pointer-events:none}
.ch{position:absolute;bottom:118px;transform:translateX(-50%);opacity:0;transition:opacity .45s,filter .3s;filter:brightness(.78) saturate(.9);will-change:opacity}
.ch.on{opacity:1}
.shd{position:absolute;bottom:100px;height:40px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(20,10,5,.55) 0%,rgba(20,10,5,.28) 45%,rgba(20,10,5,0) 72%);opacity:0;transition:opacity .45s}
.shd.on{opacity:1}
.ch.talk{filter:drop-shadow(0 0 18px rgba(255,214,140,.35));animation:bob .5s ease-out}
@keyframes bob{0%{transform:translateX(-50%) translateY(0)}35%{transform:translateX(-50%) translateY(-12px)}100%{transform:translateX(-50%) translateY(0)}}

/* dialogue */
#dlg{left:40px;right:40px;bottom:16px;height:178px;background:#fdf6e8;border:5px solid #c8a165;border-radius:26px;box-shadow:0 10px 40px rgba(0,0,0,.5);padding:22px 220px 18px 34px;cursor:pointer;transition:opacity .3s,transform .3s}
#dlg.hide{opacity:0;transform:translateY(30px);pointer-events:none}
#dlgName{position:absolute;top:-26px;left:34px;padding:6px 22px;border-radius:16px;color:#fff;font-weight:900;font-size:26px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
#dlgName:empty{display:none}
#dlgText{font-size:31px;line-height:1.32;color:#2b1d12;font-weight:700}
#dlgText.narr{font-style:italic;color:#5b4632}
#dlgBtn{position:absolute;right:26px;bottom:24px;background:#3d7a3a;color:#fff;border:none;border-radius:18px;font:900 28px "Nunito",sans-serif;padding:14px 26px;cursor:pointer;box-shadow:0 5px 0 #24521f}
#dlgBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #24521f}

/* hud */
#hud{left:0;top:0;width:1600px;height:110px;pointer-events:none}
#hud>*{pointer-events:auto}
.tbtn{position:absolute;top:18px;width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(20,16,40,.7);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tbtn svg{width:30px;height:30px}
.tbtn:hover{background:rgba(60,50,110,.9)}
#prints{position:absolute;left:310px;top:18px;height:58px;padding:0 22px 0 14px;border-radius:29px;background:rgba(253,246,232,.95);border:4px solid #c8a165;display:flex;align-items:center;gap:10px;font-weight:900;font-size:26px;color:#4a3320;opacity:0;transition:opacity .4s}
#prints.on{opacity:1}
#prints svg{width:38px;height:38px}
#loc{position:absolute;left:20px;top:92px;padding:6px 20px;border-radius:20px;background:rgba(20,16,40,.72);color:#f4e2bf;font-weight:800;font-size:26px;white-space:nowrap}
#loc:empty{display:none}
#ticket{position:absolute;right:16px;top:12px;width:352px;padding:8px 14px 10px;border-radius:16px;background:#f3e6c6;border:3px dashed #9c7a45;box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;transition:opacity .4s}
#ticket.on{opacity:1}
#ticket .tt{font-size:17px;font-weight:900;color:#7b2335;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
#ticket .slots{display:flex;gap:6px}
.slot{width:46px;height:46px;border-radius:50%;border:3px dashed #b99a66;display:flex;align-items:center;justify-content:center;position:relative}
.slot svg{width:32px;height:32px;opacity:.18}
.slot.done{border:3px solid #a82a2a;background:rgba(168,42,42,.08)}
.slot.done svg{opacity:1}
.slot.done.anim{animation:stampIn .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{0%{transform:scale(3) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg)}}

/* card */
#card{left:400px;top:34px;width:800px;max-height:832px;background:#fdf6e8;border:6px solid #c8a165;border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:26px 34px;display:flex;flex-direction:column;transition:opacity .3s,transform .3s,box-shadow .4s}
#card.hide{opacity:0;transform:scale(.94);pointer-events:none}
#card.win{box-shadow:0 0 0 8px #4caf50,0 0 70px 20px rgba(110,220,110,.75)}
#card .ch-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
#card h2{font-size:34px;font-weight:900;color:#5a2a14;line-height:1.15}
.subj{font-size:18px;font-weight:800;color:#fff;background:#8a5a2b;padding:5px 14px;border-radius:12px;white-space:nowrap}
#cardBody{position:relative;display:flex;flex-direction:column;min-height:0}
.q{font-size:28px;font-weight:700;color:#2b1d12;line-height:1.3;margin-bottom:14px}
#hint{min-height:64px;margin-top:10px;padding:12px 18px;border-radius:16px;background:#fff1d6;border:3px solid #e8b04a;font-size:24px;font-weight:700;color:#6b4206;line-height:1.25;opacity:0;transition:opacity .25s}
#hint.on{opacity:1}
#hint.good{background:#e6f6df;border-color:#5cae4f;color:#2d6a22}
.opts{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:10px}
.btn{background:#fff;border:4px solid #c8a165;border-radius:20px;font:900 34px "Nunito",sans-serif;color:#3a2614;padding:14px 34px;cursor:pointer;box-shadow:0 5px 0 #a8834b;transition:background .2s,border-color .2s}
.btn:hover{background:#fff8e6}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8834b}
.btn.ok{background:#dff3d6;border-color:#4caf50;box-shadow:0 5px 0 #2e7d32}
.btn.bad{background:#fde0dc;border-color:#e0574a;box-shadow:0 5px 0 #b23a2f;animation:shake .4s}
.btn.primary{background:#3d7a3a;color:#fff;border-color:#2c5c29;box-shadow:0 5px 0 #24521f}
.btn.ghost{background:#efe4cc}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.clocks{display:flex;justify-content:center;gap:60px;margin:18px 0 26px}
.clk{text-align:center;font-size:24px;font-weight:800;color:#6b4a2a}
.clk b{display:block;margin-top:8px;font:900 64px "Nunito",monospace;color:#7ef0a0;background:#1d2b22;border:5px solid #3b5244;border-radius:18px;padding:6px 26px;letter-spacing:2px;text-shadow:0 0 14px rgba(126,240,160,.6)}
.numrow{display:flex;align-items:center;gap:16px;margin:12px 0;font-size:27px;font-weight:700;color:#2b1d12}
.numrow span{flex:0 0 330px}
.numrow input{width:180px;font:900 34px "Nunito",sans-serif;padding:8px 14px;border:4px solid #c8a165;border-radius:14px;text-align:center;color:#2b1d12;background:#fff}
.numrow input.ok{border-color:#4caf50;background:#e8f7e2}
.numrow input.bad{border-color:#e0574a;background:#fde6e2;animation:shake .4s}
.numrow input:disabled{opacity:.5}
.numrow .btn{font-size:24px;padding:8px 20px}

/* pot puzzle */
#puz{position:relative;width:732px;height:520px;margin:0 auto}
#puzTarget{position:absolute;left:206px;top:84px;width:320px;height:352px}
.shard{position:absolute;left:206px;top:84px;width:320px;height:352px;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));transition:filter .2s}
.shard.drag{filter:drop-shadow(0 16px 14px rgba(0,0,0,.45));z-index:5}
.shard.back{transition:transform .45s ease}
.shard .in{width:100%;height:100%;pointer-events:auto;cursor:grab;touch-action:none}
.shard.placed{filter:none;z-index:0}
.shard.placed .in{pointer-events:none;cursor:default}
#puz.full #puzTarget{animation:glowPot 1.2s ease}
@keyframes glowPot{0%{filter:none}50%{filter:drop-shadow(0 0 30px #ffd76a)}100%{filter:none}}

/* ornament */
.orow{display:flex;gap:10px;justify-content:center;padding:18px;background:#7a3b22;border-radius:18px;border:4px solid #3d1c10;margin:6px auto 18px}
.tile{width:104px;height:104px;border-radius:14px;background:#d58a55;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.tile.q{background:#fff3df;border:4px dashed #b8743e;font-size:60px;font-weight:900;color:#b8743e}
.tile.q.ok{background:#dff3d6;border:4px solid #4caf50}
.tile svg{width:86px;height:86px}
.obtn{width:126px;height:126px;padding:0;display:flex;align-items:center;justify-content:center;background:#d58a55}
.obtn svg{width:100px;height:100px}
.obtn:hover{background:#e39a66}
.prog{font-size:22px;font-weight:800;color:#8a5a2b;text-align:center}

/* egypt */
.egkey{display:flex;justify-content:center;gap:16px;margin-bottom:10px;flex-wrap:wrap}
.egkey span{display:flex;align-items:center;gap:4px;background:#f1dfb8;border-radius:12px;padding:2px 12px 2px 4px;font-size:22px;font-weight:900;color:#5a3a14}
.egwall{min-height:150px;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:16px;margin:6px auto 12px;background:#e2c48a;border:5px solid #9c7a45;border-radius:14px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.egwall.ok{border-color:#4caf50;background:#e8f2cf}
.egg{display:flex;flex-wrap:wrap;max-width:170px;justify-content:center;align-items:flex-end}
.egph{font-size:22px;font-weight:700;color:#7a5a2e;align-self:center}
.egbtns{display:flex;justify-content:center;gap:14px;margin-bottom:6px}
.egb{display:flex;flex-direction:column;align-items:center;gap:6px}
.eadd{display:flex;flex-direction:column;align-items:center;padding:6px 14px;font-size:20px;background:#f1dfb8}
.edel{font-size:26px;padding:0 22px;line-height:1.3}
/* mesopotamia */
.cutab{min-height:170px;display:flex;align-items:center;justify-content:center;gap:26px;padding:16px 30px;margin:6px auto 12px;width:max-content;min-width:360px;background:#c9a77a;border:6px solid #7a5a35;border-radius:30px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18),inset 0 -10px 20px rgba(90,58,30,.25)}
.cutab.ok{border-color:#4caf50}
.cugrp{display:flex;gap:4px;align-items:center}
.cucol{display:flex;flex-direction:column}
.cuones{display:grid;grid-template-columns:repeat(3,auto);gap:0 2px}
.lawline{min-height:76px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px;margin:8px 0 16px;background:#c9a77a;border:5px solid #7a5a35;border-radius:18px;font-size:30px;font-weight:800;color:#3a2614}
.lawline.ok{border-color:#4caf50;background:#e3d3a8}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{font-size:28px;padding:10px 22px}
/* china */
.algo{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.aslot{display:flex;align-items:center;gap:14px;min-height:52px;padding:6px 14px;border-radius:14px;border:3px dashed #b8743e;background:#fff8ea;font-size:23px;font-weight:700;color:#9a8466;transition:background .2s,border-color .2s}
.aslot b{width:36px;height:36px;border-radius:50%;background:#8a3a22;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.aslot.full{border-style:solid;color:#3a2614;background:#f6e7c8;cursor:pointer}
.aslot.go{background:#fff1b8;border-color:#e8a530}
.aslot.done{background:#e3f2d6;border-color:#4caf50}
.aslot.err{background:#fde0dc;border-color:#e0574a;animation:shake .4s}
/* greece */
.chip.pick{background:#fff1b8;border-color:#e8a530;box-shadow:0 5px 0 #b8862a}
.eyes svg{width:100%;display:block;filter:drop-shadow(0 0 6px #dcff8c);animation:blink 3.4s infinite;transform-origin:50% 50%}
@keyframes blink{0%,86%,100%{transform:scaleY(1)}90%{transform:scaleY(.08)}94%{transform:scaleY(1)}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:10px 0 18px;height:230px}
.pslot{width:140px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;position:relative}
.pslot span{font-size:26px;font-weight:900;color:#3a2614;min-height:36px}
.pslot b{width:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;background:#b9b2a2;border-radius:10px 10px 0 0;border:3px solid #8a7e68}
.pslot.p1 b{height:130px;background:#d9b44a}.pslot.p2 b{height:100px;background:#b8bcc6}.pslot.p3 b{height:76px;background:#c98a52}.pslot.p4 b{height:54px}
.pslot.full{cursor:pointer}
.wreath{position:absolute;top:-62px;width:64px;height:64px}.wreath svg{width:64px;height:64px}
/* rome + finale */
.keyglow{position:absolute;left:722px;top:0;width:170px;height:140px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,246,190,1) 0%,rgba(255,220,110,.85) 35%,rgba(255,220,110,0) 70%);mix-blend-mode:screen;animation:kg 1.3s ease-in-out 4;pointer-events:none}
@keyframes kg{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
.match{display:flex;gap:26px;justify-content:center;margin-top:6px}
.mcol{display:flex;flex-direction:column;gap:10px;width:340px}
.mh{text-align:center;font-size:22px;font-weight:900;color:#8a5a2b;text-transform:uppercase;letter-spacing:1px}
.mi{font-size:21px;padding:10px 14px;line-height:1.2;position:relative}
.mi.pick{background:#fff1b8;border-color:#e8a530;box-shadow:0 5px 0 #b8862a}
.mi.ok::after{content:attr(data-n);position:absolute;right:-12px;top:-12px;width:28px;height:28px;border-radius:50%;background:#4caf50;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.dipl svg{width:720px;height:480px;display:block;margin:0 auto;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.glint{animation:gl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes gl{0%,100%{opacity:.35}50%{opacity:1}}
.endscr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:radial-gradient(ellipse at 50% 40%,#3a2d6b 0%,#0d0b18 75%)}
.endscr p{font-size:56px;font-weight:900;color:#ffe3a3;font-style:italic;text-shadow:0 0 30px rgba(255,200,120,.4)}
/* labels */
.labels{display:flex;flex-direction:column;gap:16px;align-items:center;margin-top:8px}
.plank{width:600px;font-size:28px;padding:16px 20px;background:#f1d9a7;border-color:#8a5a2b;box-shadow:0 5px 0 #6b431f;color:#3a2614}

/* plan */
#plan{position:relative;width:732px;height:600px;margin:0 auto}
#plan svg{width:732px;height:600px}
.room{cursor:pointer}
.room.locked{cursor:default}
.room.avail rect.box,.room.avail circle.box{animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{stroke:#e8a530;stroke-width:6}50%{stroke:#ffe08a;stroke-width:10}}

/* props */
.paw{position:absolute;width:54px;height:54px;cursor:pointer;opacity:.55;transition:opacity .3s,transform .3s}
.paw:hover{opacity:.8}
.paw.clue{opacity:1}.paw.clue img{width:100%;display:block;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28%);mask-image:linear-gradient(to right,transparent 0,#000 28%)}
.paw.pulse{animation:pawPulse 1s infinite;opacity:.95}
@keyframes pawPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #ffd76a)}50%{transform:scale(1.35);filter:drop-shadow(0 0 18px #ffd76a)}}
.paw.found{animation:pawFound .9s forwards;pointer-events:none}
@keyframes pawFound{0%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 20px #ffe58a)}60%{transform:scale(1.8);opacity:1;filter:drop-shadow(0 0 30px #ffe58a)}100%{transform:scale(.4) translate(-1600px,-1400px);opacity:0}}
#toast{position:absolute;left:50%;top:96px;transform:translate(-50%,-20px);background:#fdf6e8;border:4px solid #c8a165;border-radius:20px;padding:10px 26px;font-size:26px;font-weight:900;color:#5a2a14;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fade{position:absolute;inset:0;background:#0d0b18;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1}
#startScr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;background:radial-gradient(ellipse at 50% 40%,#3a2d6b 0%,#1a1533 70%)}
#startScr h1{font-size:84px;font-weight:900;color:#ffe3a3;text-shadow:0 6px 0 #6b3a14,0 0 40px rgba(255,200,120,.4);text-align:center;line-height:1.05}
#startScr p{font-size:30px;color:#e9dcff;font-weight:700}
#startScr .btn{font-size:40px;padding:18px 60px}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="props"></div>
  <div id="cast"></div>
  <div id="hud">
    <button class="tbtn" id="skipBtn" style="left:20px" title="Далі (для вчителя): пропустити репліку або завдання">
      <svg viewBox="0 0 24 24"><path d="M4 5l9 7-9 7z M13 5l7 7-7 7z" fill="#f4e2bf"/></svg></button>
    <button class="tbtn" id="fsBtn" style="left:92px" title="Повноекранний режим">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f4e2bf" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="tbtn" id="sndBtn" style="left:164px" title="Звуки (M)"></button>
    <button class="tbtn" id="musBtn" style="left:236px" title="Музика (N)"></button>
    <div id="prints"><span id="pawIco"></span><span id="printsTxt">Сліди: 0 з 6</span></div>
    <div id="loc"></div>
    <div id="ticket"><div class="tt">Квиток відвідувача</div><div class="slots" id="slots"></div></div>
  </div>
  <div id="card" class="hide"><div class="ch-head"><h2 id="cardTitle"></h2><span class="subj" id="cardSubj"></span></div><div id="cardBody"></div><div id="hint"></div></div>
  <div id="dlg" class="hide"><div id="dlgName"></div><div id="dlgText"></div><button id="dlgBtn">Далі ▶</button></div>
  <div id="toast"></div>
  <div id="fade"></div>
  <div id="startScr">
    <h1>Мурко<br>і Ніч у музеї</h1>
    <p>Урок-квест про давні цивілізації · 4 клас</p>
    <button class="btn primary" id="startBtn">Почати ▶</button>
  </div>
</div>

<script>
"use strict";
/* ============ БАЗА ============ */
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
let SCALE=1;
function fit(){
  const s=Math.min(innerWidth/1600,innerHeight/900);SCALE=s;
  $("stage").style.transform=`translate(${(innerWidth-1600*s)/2}px,${(innerHeight-900*s)/2}px) scale(${s})`;

function potPuzzle(b,win){
  const P=[[0,0,33,0,38,24,36,47,18,56,0,50],[33,0,67,0,62,26,64,55,50,44,36,47,38,24],[67,0,100,0,100,52,82,48,64,55,62,26],
           [0,50,18,56,36,47,28,74,30,100,0,100],[36,47,50,44,64,55,72,78,70,100,30,100,28,74],[64,55,82,48,100,52,100,100,70,100,72,78]];
  const W=320,H=352,FX=206,FY=84;
  b.innerHTML=`<div class="q" style="text-align:center;margin-bottom:4px">Перетягніть черепки на контур горщика.</div><div id="puz"><div id="puzTarget">${potSVG("tg")}</div></div><div class="prog" id="pp">Склеєно: 0 з 6</div>`;
  const tg=$("puzTarget");tg.style.opacity=".16";tg.style.filter="grayscale(1)";
  const slots=shuffle([[110,110],[110,290],[110,460],[622,110],[622,290],[622,460]]);
  let placed=0;const puz=$("puz");
  P.forEach((pts,i)=>{
    const poly=[];let sx=0,sy=0;for(let k=0;k<pts.length;k+=2){poly.push(pts[k]+"% "+pts[k+1]+"%");sx+=pts[k];sy+=pts[k+1]}
    const n=pts.length/2,ccx=FX+sx/n/100*W,ccy=FY+sy/n/100*H;
    const home=[slots[i][0]-ccx,slots[i][1]-ccy];
    const sh=el("div","shard");const inn=el("div","in",potSVG("s"+i));inn.style.clipPath=`polygon(${poly.join(",")})`;sh.appendChild(inn);puz.appendChild(sh);
    let x=home[0],y=home[1];const setT=()=>sh.style.transform=`translate(${x}px,${y}px)`;setT();
    let st=null;
    inn.addEventListener("pointerdown",e=>{e.preventDefault();inn.setPointerCapture(e.pointerId);sh.classList.remove("back");sh.classList.add("drag");st={px:e.clientX,py:e.clientY,x,y}});
    inn.addEventListener("pointermove",e=>{if(!st)return;x=st.x+(e.clientX-st.px)/SCALE;y=st.y+(e.clientY-st.py)/SCALE;setT()});
    const up=()=>{if(!st)return;st=null;sh.classList.remove("drag");
      if(Math.hypot(x,y)<42){x=0;y=0;setT();sh.classList.add("placed");sfx("clay");placed++;$("pp").textContent=`Склеєно: ${placed} з 6`;hint("");
        if(placed===6){tg.style.opacity="1";tg.style.filter="none";puz.classList.add("full");puz.querySelectorAll(".shard").forEach(s=>s.style.opacity="0");win("Горщик знову цілий!")}}
      else{const cx2=ccx+x,cy2=ccy+y;
        if(cx2>FX&&cx2<FX+W&&cy2>FY&&cy2<FY+H){sh.classList.add("back");x=home[0];y=home[1];setT();hint("Цей черепок — з іншого місця. Дивіться, як продовжується спіраль на краю черепка.")}}};
    inn.addEventListener("pointerup",up);inn.addEventListener("pointercancel",up);
  });
}

function greekWords(b,win){
  const greek=shuffle(["театр","алфавіт","географія","математика","олімпіада","музей"]).slice(0,4);
  const other=["сонце","вода","вишня","рука"];
  const all=shuffle([...greek,...other]);const sel=new Set();
  b.innerHTML=`<div class="q" style="text-align:center">Які слова прийшли до нас із грецької мови? Позначте всі, а потім натисніть «Перевірити».</div>
    <div class="chips" id="ch" style="margin:16px 0 20px"></div><div class="opts"><button class="btn primary" id="chk">Перевірити</button></div>`;
  all.forEach(w=>{const c=el("button","btn chip",w);c.onclick=()=>{if(c.disabled)return;sel.has(w)?(sel.delete(w),c.classList.remove("pick")):(sel.add(w),c.classList.add("pick"));hint("")};$("ch").appendChild(c)});
  $("chk").onclick=()=>{
    const wrong=[...sel].filter(w=>other.includes(w)),miss=greek.filter(w=>!sel.has(w));
    document.querySelectorAll("#ch .chip").forEach(c=>{const w=c.textContent;c.classList.remove("ok","bad");
      if(sel.has(w)&&greek.includes(w)){c.classList.remove("pick");c.classList.add("ok");c.disabled=true}else if(sel.has(w)){void c.offsetWidth;c.classList.add("bad");sfx("bad")}});

    else hint(`Знайдено не всі. Підказка: шукайте назви наук, свят і закладів — їх часто дали греки.`);
  };
}

function archSVG(w=300,hk=false){
  const cx=150,cy=190,r1=70,r2=125,n=7;let s="";
  for(let i=0;i<n;i++){const a1=Math.PI-i*Math.PI/n,a2=Math.PI-(i+1)*Math.PI/n,k=i===3;
    const P=[[r2,a1],[r2,a2],[r1,a2],[r1,a1]].map(([r,a])=>`${(cx+r*Math.cos(a)).toFixed(1)},${(cy-r*Math.sin(a)).toFixed(1)}`).join(" ");
    s+=`<polygon points="${P}" fill="${k&&hk?"#ffe08a":"#e3d3b0"}" stroke="#7a5a35" stroke-width="4"/>`;
    if(k)s+=`<text x="${cx}" y="${cy-r2+30}" text-anchor="middle" font-size="26" font-weight="900" fill="#7b2335" font-family="Nunito,sans-serif">${hk?"":"?"}</text>`}
  s+=`<rect x="${cx-r2}" y="${cy}" width="${r2-r1}" height="44" fill="#d8c7a2" stroke="#7a5a35" stroke-width="4"/><rect x="${cx+r1}" y="${cy}" width="${r2-r1}" height="44" fill="#d8c7a2" stroke="#7a5a35" stroke-width="4"/>`;
  return `<svg viewBox="0 0 300 240" width="${w}" height="${w*0.8}" style="display:block;margin:0 auto 12px">${s}</svg>`;
}

       h:"Подумайте, який камінь тримає обидві половини арки разом, ніби замок.",ok:"Так! Верхній камінь називають замковим — він «замикає» арку."}],"Секрет арки розгадано!"));
    const g=el("div","keyglow");$("props").appendChild(g);sfx("magic");setTimeout(()=>g.remove(),5200);
    await say("pugach",5,"Ось він — замковий камінь, угорі нашої арки! Без нього вона б розсипалася.");
  }
  await say("pugach",1,"А ще римляни вміли робити бетон. Бетонний купол Пантеону в Римі стоїть уже майже 1 900 років!");
  await say("pugach",6,"Остання табличка! Що подарував світові Давній Рим?");
  await task("Поверни табличку","Що подарувала цивілізація",(b,win)=>labelTask(b,win,{
    pic:archSVG(220,true),ok:"Давній Рим. Дороги, акведуки й арки",bad:["Давня Греція. Театр","Трипілля. Розписна кераміка"],
    hint:"Згадайте, що стоїть у цій залі: придорожній камінь, акведук і велика арка."}));
  await hallEnd(5,"Подивіться на макет акведука — на ньому щось є! Натисніть!",
    "Слід просто на макеті акведука! І ще один… Вони ведуть кудись далі.","Усі шість печаток! Тепер має відчинитися центральна зала!");
}

/* ============ ФІНАЛ ============ */
const PAIRS=[
  ["Трипільський розписний горщик","Розмальована керамічна чашка"],
  ["Єгипетський календар на 365 днів","Календар на стіні"],
  ["Табличка з лічбою шістдесятками","Годинник: 60 хвилин"],
  ["Колесо з Месопотамії","Велосипед"],
  ["Китайський папір","Шкільний зошит"],
  ["Компас-ложка","Компас у телефоні"],
  ["Оливковий вінок переможця","Олімпійська медаль"],
  ["Римський акведук","Водопровідний кран"]];
function giftsMatch(b,win){
  const P=shuffle(PAIRS).slice(0,6);let left=null,done=0;
  b.innerHTML=`<div class="q" style="text-align:center">З’єднайте давній дарунок із річчю, якою ми користуємося сьогодні: спершу — ліворуч, потім — праворуч.</div>
    <div class="match"><div class="mcol" id="ml"><div class="mh">Давнина</div></div><div class="mcol" id="mr"><div class="mh">Сьогодні</div></div></div>`;
  shuffle(P).forEach(([a])=>{const x=el("button","btn mi",a);x.dataset.a=a;x.onclick=()=>{if(x.disabled)return;document.querySelectorAll("#ml .mi").forEach(y=>y.classList.remove("pick"));x.classList.add("pick");left=a;hint("")};$("ml").appendChild(x)});
  shuffle(P).forEach(([a,m])=>{const x=el("button","btn mi",m);x.onclick=()=>{
    if(x.disabled)return;if(!left){hint("Спершу оберіть давній дарунок ліворуч.");return}
    const pair=P.find(p=>p[0]===left);
    if(pair[1]===m){done++;const L=document.querySelector(`#ml .mi[data-a="${CSS.escape(left)}"]`);[L,x].forEach(y=>{y.classList.remove("pick");y.classList.add("ok");y.disabled=true;y.dataset.n=done});left=null;
      if(done===P.length)win("Усі пари з’єднано!");else hint("Так! Наступна пара.","good")}
    else{x.classList.remove("bad");void x.offsetWidth;x.classList.add("bad");sfx("bad");hint("Подумайте: для чого служила давня річ? Яка сьогоднішня річ робить те саме?")}};$("mr").appendChild(x)});
}
function diplomaSVG(){
  const n=ST.prints.reduce((a,b)=>a+b,0);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Nunito,Segoe UI,Arial,sans-serif">
   <rect width="1200" height="800" fill="#f6e9c8"/><rect x="24" y="24" width="1152" height="752" rx="30" fill="none" stroke="#9c7a45" stroke-width="8"/>
   <rect x="44" y="44" width="1112" height="712" rx="22" fill="none" stroke="#c9a24a" stroke-width="3" stroke-dasharray="14 10"/>
   <text x="600" y="150" text-anchor="middle" font-size="64" font-weight="900" fill="#7b2335">ДИПЛОМ</text>
   <text x="600" y="228" text-anchor="middle" font-size="46" font-weight="900" fill="#3a2614">Юний доглядач музею</text>
   <text x="600" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#5a3a1e">за порятунок виставки «Дарунки давніх цивілізацій»</text>
   <text x="600" y="342" text-anchor="middle" font-size="28" font-weight="700" fill="#5a3a1e">за одну ніч у музеї</text>
   ${HALLS.map((h,i)=>`<g transform="translate(${180+i*150} 400)"><circle cx="45" cy="45" r="52" fill="none" stroke="#a82a2a" stroke-width="5"/><g transform="translate(8 8) scale(.74)">${ICON[h.icon]("#a82a2a")}</g>
     <text x="45" y="134" text-anchor="middle" font-size="22" font-weight="800" fill="#3a2614">${h.name}</text></g>`).join("")}
   <text x="600" y="610" text-anchor="middle" font-size="26" font-weight="700" fill="#5a3a1e">Знайдено слідів Шустрика: ${n} з 6</text>
   <text x="200" y="700" font-size="26" font-weight="800" fill="#3a2614">Пан Пугач, доглядач музею</text>
   <text x="1000" y="700" text-anchor="end" font-size="26" font-weight="800" fill="#3a2614">Мурко і Сніжок</text></svg>`;
}
function diplomaTask(b,win){
  b.innerHTML=`<div class="dipl">${diplomaSVG()}</div><div class="opts" style="margin-top:14px"><button class="btn" id="dsave">Зберегти картинкою</button><button class="btn primary" id="dnext">Далі ▶</button></div>`;
  $("dnext").onclick=()=>taskEnd("ok");
  $("dsave").onclick=async()=>{
    try{const svg=new Blob([diplomaSVG()],{type:"image/svg+xml"}),url=URL.createObjectURL(svg),im=new Image();
      await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=url});
      const c=document.createElement("canvas");c.width=1200;c.height=800;c.getContext("2d").drawImage(im,0,0);URL.revokeObjectURL(url);
      /* в артефакті Claude файл зберігається через можливість downloads; у звичайному браузері — через посилання */
      const dl=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;
      if(dl){const blob=await new Promise(r=>c.toBlob(r,"image/png"));
        try{await dl.save({filename:"dyplom-muzei.png",data:blob});hint("Диплом збережено!","good")}
        catch(e){hint(e&&e.code==="declined"?"Збереження скасовано.":"Не вдалося зберегти — зробіть знімок екрана.")}
        return}
      const a=document.createElement("a");a.download="dyplom-muzei.png";a.href=c.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
      hint("Диплом збережено в «Завантаження». Якщо файл не з’явився — зробіть знімок екрана.","good")}
    catch(e){hint("Тут браузер не дозволяє зберегти файл — зробіть знімок екрана.")}};
}
async function finale(){
  /* центральна зала на світанку */
  sfx("creak");
  await fadeTo(()=>{setLoc("Центральна зала");music("m8","scene");bgImage("central",bgPlain("#e8c9a8","#7a5a40"));clearProps();castOnly(["murko","snizhok","pugach"]);pose("murko",3);pose("snizhok",1);pose("pugach",1);setCx("pugach",1280)});
  await say(null,0,"Двері центральної зали повільно відчиняються. За вікнами вже світає…");
  await say("pugach",2,"У цій залі давні дарунки стоять поруч із сучасними речами. Але й тут пари розсипалися!");
  await task("Що нам подарували","Підсумок · усі предмети",(b,win)=>giftsMatch(b,win));
  await say("murko",2,"Виходить, давні люди досі живуть у наших речах!");
  const n=ST.prints.reduce((a,b)=>a+b,0);
  await say("pugach",4,"Але в одній вітрині досі порожньо — бракує останнього експоната…");
  await say("snizhok",5,n>=6?"Тссс… Ми знайшли всі шість слідів — і всі вони ведуть до дверей комори! Там хтось шурхоче…":(n?`Ми знайшли ${n} ${n===1?"слід":n<5?"сліди":"слідів"} з 6 — а я ще бачив сліди он там, біля дверей комори!`:"Я бачив крихітні сліди он там, біля дверей комори!")+" Тссс… Там хтось шурхоче…");
  /* комора */
  sfx("creak");
  await fadeTo(()=>{setLoc("Комора");bgImage("storeroom",bgPlain("#3a2d4a","#1a1422"));castOnly(["murko","snizhok","pugach"]);pose("murko",3);pose("snizhok",5);pose("pugach",3);setCx("snizhok",470);setCx("pugach",1290);setCx("shustryk",820)});
  await say(null,0,"У коморі — маленький «музей»: коробки розмальовані спіралями й ієрогліфами, на них — картонні піраміди, храм і справжня амфора. А за коробкою хтось ховається…");
  sfx("rustle");show("shustryk",4);
  await say("murko",3,"Хто це?");
  await say("shustryk",4,"Я… Шустрик. Вибачте! Я не хотів нічого зіпсувати. Речі такі гарні й давні, що мені дуже захотілося свій власний музей. Я будував його з коробок, позичав експонати… і все переплутав.");
  const c=await task("Як нам учинити?","Вибір класу",(b,win)=>{
    b.innerHTML=`<div class="q" style="text-align:center;margin:16px 0">Мурко питає клас: що скажемо Шустрику?</div><div class="labels" id="o"></div>`;
    const a=el("button","btn plank","Пробачити й запросити допомагати"),s=el("button","btn plank","Показати йому, що де має стояти");
    a.onclick=()=>taskEnd("a");s.onclick=()=>taskEnd("b");$("o").append(a,s)});
  if(c==="b")await say("snizhok",2,"Ходімо, ми тобі покажемо! Ми вже знаємо всі шість зал — і що в кожній має лежати.");
  else await say("murko",2,"Ми не сердимося! Краще допомагай нам — ти ж так любиш давні речі.");
  await say("shustryk",5,"Дякую! Тоді я зараз же поверну останній експонат на місце.");
  await say("pugach",1,"Знаєш, Шустрику, музею саме такий помічник і потрібен — той, хто любить давні речі. Хочеш стати помічником екскурсовода?");
  await say("shustryk",6,"Справді?! Так! А таблички я тепер писатиму без помилок!");
  /* ранок, відкриття */
  await fadeTo(()=>{setLoc("Хол музею · 9:00");music("m9","bright");setTimeout(()=>sfx("bell"),600);bgImage("lobby-day",bgLobby(false),bannerText());castOnly(["murko","snizhok","pugach","shustryk"]);pose("murko",2);pose("snizhok",2);pose("pugach",5);pose("shustryk",7);setCx("pugach",1380);setCx("shustryk",1050)});
  await say(null,0,"Годинник у холі показує 9:00. Крізь вікна ллється ранкове сонце, і двері музею відчиняються.");
  await say("pugach",5,"Виставку «Дарунки давніх цивілізацій» відкрито! І перші її відвідувачі — це ви, наші рятівники.");
  await say("shustryk",7,"А я тепер — помічник екскурсовода! Ласкаво просимо!");
  setTimeout(()=>sfx("fanfare"),250);
  await task("Диплом","Нагорода",(b,win)=>diplomaTask(b,win));
  /* тизер */
  await fadeTo(()=>{setLoc("");music("m10","scene");$("ticket").classList.remove("on");$("prints").classList.remove("on");
    bgImage("attic",bgPlain("#7a5030","#3a2414"),`<g class="glint" transform="translate(965 470)"><circle r="26" fill="#fff6c8" opacity=".55"/><path d="M0 -38 L6 -6 L38 0 L6 6 L0 38 L-6 6 L-38 0 L-6 -6Z" fill="#fffbe6"/></g>`);
    castOnly(["murko"]);setCx("murko",600);pose("murko",4)});
  await say(null,0,"Вечір. Мурко вдома піднімається на горище, щоб сховати квиток із печатками в коробку зі скарбами.");
  await say("murko",4,"Шкода, що не можна побачити, якою була та Олександрійська бібліотека…");
  sfx("chime");
  await say("murko",3,"Стоп. А що це там блищить на поличці?");
  await fadeTo(()=>{castOnly([]);dlgHide();$("bg").innerHTML="";
    const e=el("div","endscr",`<p>Але це вже зовсім інша історія…</p><button class="btn primary" id="again">Пройти ще раз ↻</button>`);$("props").appendChild(e);
    $("again").onclick=()=>location.reload()});
  sfx("magic");
}

/* ============ ЗАЛИ, ЩО ГОТУЮТЬСЯ ============ */
async function hallSoon(i){
  setLoc("Хол музею");
  await say("pugach",4,`Зала «${HALLS[i].name}» ще готується до відкриття… Далі буде!`);
}

/* ============ СЦЕНАРІЙ ============ */
async function lobbyPlan(){
  await fadeTo(()=>{setLoc("Хол музею");music("m1","scene");bgImage("lobby-mess",bgLobby(true),bannerText()+pawTrail());clearProps();castOnly(["murko","pugach"]);pose("murko",1);pose("pugach",1)});
}
async function main(){
  const q=new URLSearchParams(location.search).get("start");
  $("startScr").remove();
  /* ?start=hall2 — одразу до потрібної зали (для перевірки): попередні зали вважаються пройденими */
  const m=/^hall(\d)$/.exec(q||"")||(q==="final"?[0,"7"]:null);
  if(!m){await intro()}else{for(let k=0;k<+m[1]-1;k++){ST.stamps[k]=1;ST.prints[k]=1;$("slot"+k).classList.add("done")}
    hudOn();updPrints();bgImage("lobby-mess",bgLobby(true),bannerText()+pawTrail());castOnly(["murko","pugach"])}
  const HALL_FN=[hall1,hall2,hall3,hall4,hall5,hall6];
  while(ST.stamps.indexOf(0)>=0){
    castOnly(["murko","pugach"]);
    let i=await planTask();
    if(i==="skip")i=ST.stamps.indexOf(0);
    if(HALL_FN[i]){await HALL_FN[i]();await lobbyPlan()}else{await hallSoon(i);break}
  }
  if(q==="final"){await finale();return}
  castOnly(["murko","pugach"]);
  await say("pugach",5,"Усі шість печаток! Центральна зала відчиняється…");
  await planTask();
  await finale();
}
$("sndBtn").innerHTML=SND.on?SND_ON:SND_OFF;$("musBtn").innerHTML=MUS.on?MUS_ON:MUS_OFF;
$("sndBtn").onclick=e=>{e.stopPropagation();setSound(!SND.on)};
$("musBtn").onclick=e=>{e.stopPropagation();setMusic(!MUS.on)};
$("startBtn").onclick=()=>{audioInit();music("m1","scene");main()};
